name: Linting

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - develop

  pull_request:

concurrency:
  group: lint-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1

      matrix:
        python-version: ['3.14']

    name: Python ${{ matrix.python-version }} Test Pop

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v10

      - name: Install dependencies  # only the linters, as these are static checks which don't import the code
        run: |
          uv pip install --system pydocstyle black flake8 ruff

      - name: ruff
        run:  |
          ruff --version
          ruff check shakenbreak tests

      - name: check docstrings
        run:  |
          pydocstyle --version
          pydocstyle -e --count --convention=google --add-ignore=D400,D415,D212,D205,D417,D107 shakenbreak

      - name: black  # max line length 107 specified in pyproject.toml
        run:  |
          black --version
          black --check --diff --color shakenbreak tests

      - name: flake8
        run:  |
          flake8 --version
          flake8 --max-line-length 107 --color always --ignore=E121,E123,E126,E203,E226,E24,E704,W503,W504,F401,E203 shakenbreak tests
