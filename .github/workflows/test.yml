name: Tests

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - develop

  pull_request:

concurrency:  # cancel running jobs when a newer commit lands on the same PR/branch
  group: tests-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false

      matrix:
        os: [ ubuntu-latest, macos-latest ]
        python-version: [ '3.12', '3.14' ]  # lowest and highest supported Python versions (doped v4 needs >= 3.12)

    env:
      MPLBACKEND: Agg  # non-interactive backend for matplotlib

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Install dependencies
        run: |
          # TODO: temporary until doped v4 released:
          git clone --depth 1 --branch develop https://github.com/SMTG-Bham/doped.git "$RUNNER_TEMP/doped"
          # ``ase`` 3.29.0 sets ``ndarray.shape``, deprecated in NumPy 2.5, which the test config treats as an
          # error; drop the ``numpy`` pin at the next ``ase`` release (TODO):
          uv pip install --system -e ".[tests]" "$RUNNER_TEMP/doped" "numpy<2.5"

      - name: Test
        run: |
          pytest -vv --mpl --mpl-results-path=tests/remote_baseline --durations=20 tests

      - name: Archive test plots  # result, baseline and diff images for any failed image comparisons
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: SnB_GH_test_plots_${{ matrix.os }}_${{ matrix.python-version }}
          path: tests/remote_baseline
          if-no-files-found: ignore  # no image comparison failures (i.e. only non-plotting tests failed)
