name: Release and publish

on:
  workflow_run:
    workflows: [ "Tests" ]
    branches: [ main ]
    types:
      - completed  # only release when tests have passed

  workflow_dispatch:  # or when manually run

permissions:
  contents: write  # to create the release tag & GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.event == 'push') }}
    # only run when tests have passed (or manually triggered), and only for pushes to this repository

    steps:
      - uses: actions/checkout@v7
        with:  # the commit which passed the tests (rather than the latest on main), if triggered by them
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Check if version has changed
        id: check_version
        run: |
          # (first output line is ``shakenbreak (<latest version>)``; the ``LATEST:`` line is only printed if installed)
          current_pip_version=$(pip index versions shakenbreak | awk 'NR==1 {gsub(/[()]/, "", $2); print $2}')
          current_repo_version=$(grep version setup.py | awk -F\" '{print $2}' | head -1)
          if [ "$current_pip_version" != "$current_repo_version" ]; then
            echo "version_changed=true" >> $GITHUB_ENV
          else
            echo "version_changed=false" >> $GITHUB_ENV
          fi

      - name: Build packages  # (in an isolated build environment, so ShakeNBreak & its dependencies aren't needed)
        if: env.version_changed == 'true'
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish
        if: env.version_changed == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.TWINE_PASSWORD }}

      - name: Generate release info
        if: env.version_changed == 'true'
        run: |
          awk 'BEGIN {p = 0} {a = 0 }; /^v\d*.\d*.\d*./ { p += 1; a = 1}; p + a == 1 { print } ' CHANGELOG.rst | sed -e '1,1d' | sed  -e '/./,$!d' -e :a -e '/^\n*$/{$d;N;ba' -e '}' > release_info.txt
          echo "version=$(grep version setup.py | awk -F\" '{print $2}' | head -1)" >> $GITHUB_ENV

      - name: Release
        if: env.version_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ env.version }}" --title "${{ env.version }}" --notes-file release_info.txt \
            --target "${{ github.event.workflow_run.head_sha || github.sha }}"
