name: pip install ShakeNBreak

on:
  workflow_dispatch:

  workflow_run:
    workflows: ["Release and publish"]
    branches: [main]
    types:
      - completed  # only test when new release has been deployed to PyPI

jobs:
  test:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    # only run when tests have passed (or manually triggered)

    strategy:
      fail-fast: false

      matrix:
        os: [ ubuntu-latest, macos-latest ]
        python-version: [ '3.12', '3.14' ]  # lowest and highest supported Python versions (doped v4 needs >= 3.12)

    env:
      MPLBACKEND: Agg  # non-interactive backend for matplotlib

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          sleep 300  # wait 5 minutes for PyPI to update with the new release
          # ``ase`` 3.29.0 sets ``ndarray.shape``, deprecated in NumPy 2.5, which the test config treats as an
          # error; drop the ``numpy`` pin at the next ``ase`` release (TODO):
          pip install shakenbreak[tests] "numpy<2.5"  # install only from PyPI

      - name: Test
        run: |
          pytest -vv --mpl --mpl-results-path=tests/remote_baseline --durations=20 tests

      - name: Archive test plots  # result, baseline and diff images for any failed image comparisons
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: SnB_pip_install_test_plots_${{ matrix.os }}_${{ matrix.python-version }}
          path: tests/remote_baseline
          if-no-files-found: ignore  # no image comparison failures (i.e. only non-plotting tests failed)
