version: 2
updates:
- package-ecosystem: pip
  directory: "/"
  target-branch: develop                    # PRs land where development happens, not on the release branch
  versioning-strategy: increase-if-necessary
  schedule:
    interval: daily
  groups:
    python-packages:
      patterns:
        - "*"
  open-pull-requests-limit: 2
  allow:
    - dependency-type: direct
    - dependency-type: indirect
