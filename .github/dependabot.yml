version: 2
updates:
- package-ecosystem: pip
  directory: "/"
  schedule:
    interval: daily
  groups:
    python-packages:
      patterns:
        - "*"
  open-pull-requests-limit: 2
  allow:
    - dependency-type: direct
    - dependency-type: indirect
- package-ecosystem: github-actions  # keep the workflow actions (checkout, setup-python etc) up to date
  directory: "/"
  schedule:
    interval: weekly
  groups:
    github-actions:
      patterns:
        - "*"
